name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# shortcut: pin the proposed shared API for PR CI, remove after 0.1 is registered.
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Prereleases are tested for early warning but do not block merging.
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
      id-token: write # authenticate Codecov uploads with GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'   # lowest Julia version allowed by [compat]
          - '1'     # latest release
          - 'pre'   # latest prerelease, if any
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - name: Check out proposed Hamiltonians
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: JuliaFewBody/FewBodyHamiltonians.jl
          ref: e67bc19ca413849c244384fe0ce028da00fb323c
          path: .ci/FewBodyHamiltonians
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Use proposed Hamiltonians
        if: github.event_name == 'pull_request'
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # Julia 1.11 records a zero-count line for every macro-generated method
      # signature (e.g. each `@recipe` line), which Codecov reports as a miss
      # even when the method is exercised; coverage is taken from the other jobs.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version != 'min'
      - uses: codecov/codecov-action@v7
        if: matrix.version != 'min'
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out proposed Hamiltonians
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: JuliaFewBody/FewBodyHamiltonians.jl
          ref: e67bc19ca413849c244384fe0ce028da00fb323c
          path: .ci/FewBodyHamiltonians
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Use proposed Hamiltonians in docs
        if: github.event_name == 'pull_request'
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians")),
          ])
      # docs/Project.toml points at the repository checkout through [sources],
      # so instantiating the docs environment builds against this commit.
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
