name: Aqua
# Runs the Aqua and ExplicitImports checks of test/Aqua.jl on their own, for
# the README badge; the full test suite in ci.yml runs them as well.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# shortcut: pin the proposed shared API for PR CI, remove after 0.1 is registered.
jobs:
  test:
    name: Aqua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out proposed Hamiltonians
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: JuliaFewBody/FewBodyHamiltonians.jl
          ref: e67bc19ca413849c244384fe0ce028da00fb323c
          path: .ci/FewBodyHamiltonians
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Use proposed Hamiltonians
        if: github.event_name == 'pull_request'
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians"))
      # The test dependencies live in [extras]/[targets] of Project.toml;
      # TestEnv builds that environment, honoring its [compat] bounds.
      - name: Run Aqua
        run: |
          julia --startup-file=no --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add("TestEnv")
            using TestEnv
            Pkg.activate(".")
            TestEnv.activate()
            using Test, FewBodyECG
            @testset "Aqua" include("test/Aqua.jl")'
