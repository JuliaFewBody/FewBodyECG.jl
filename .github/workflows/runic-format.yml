name: Runic formatting
# Fails when Julia files are not formatted with Runic.jl; format locally with
# `runic --inplace .` (or Runic.format_file) before pushing.
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
jobs:
  runic:
    name: Runic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
