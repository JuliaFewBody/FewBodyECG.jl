<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { color-scheme: light dark; }
html,body { margin:0; padding:0; background:transparent; color:var(--foreground); font-family:var(--font-sans); }
#ecg-counts { display:grid; gap:20px; }
#ecg-counts h3 { margin:0; font-size:16px; font-weight:500; }
#ecg-counts .row { display:grid; gap:7px; }
#ecg-counts .label { display:flex; justify-content:space-between; gap:12px; font-size:14px; }
#ecg-counts .value { font-variant-numeric:tabular-nums; }
#ecg-counts .track { height:20px; background:color-mix(in srgb,var(--foreground) 5%,transparent); }
#ecg-counts .bar { height:20px; background:var(--chart-1); }
#ecg-counts .axis { display:flex; justify-content:space-between; font-size:12px; color:var(--muted-foreground); }
#ecg-counts .note { margin:0; font-size:12px; color:var(--muted-foreground); }
</style></head>
<body><figure id="ecg-counts" style="margin:0" aria-label="OpenAlex ECG search counts, 4 November 2026. Title only: 131 records. Title or abstract: 377. Broad search: 699. Nested search scopes, not separate groups or a deduplicated paper census.">
<h3>ECG literature: the count depends on search scope</h3>
<div class="row"><div class="label"><span>Title only</span><span class="value">131 records</span></div><div class="track"><div class="bar" style="width:18.7142857%"></div></div></div>
<div class="row"><div class="label"><span>Title or abstract</span><span class="value">377 records</span></div><div class="track"><div class="bar" style="width:53.8571429%"></div></div></div>
<div class="row"><div class="label"><span>Broad search</span><span class="value">699 records</span></div><div class="track"><div class="bar" style="width:99.8571429%"></div></div></div>
<div class="axis" aria-hidden="true"><span>0</span><span>350</span><span>700 records</span></div>
<figcaption class="note">OpenAlex · 4 Nov 2026 · “explicitly correlated gaussian”<br>Nested scopes. Broad search includes available full text and keywords. Counts have not been screened or deduplicated across publication versions.</figcaption>
</figure></body></html>
